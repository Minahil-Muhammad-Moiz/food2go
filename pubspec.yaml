name: food2go
description: A food intake tracking app for healthy eating
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  
  # ========================================
  # STATE MANAGEMENT
  # ========================================
  # GetX - State management, navigation, and dependency injection
  # WHY: Simplifies state management, easy to learn, reactive UI
  get: ^4.6.6
  
  # ========================================
  # UI & STYLING
  # ========================================
  # Google Fonts - Beautiful fonts
  # WHY: Professional typography without adding font files
  google_fonts: ^6.1.0
  
  # SVG Support - Vector images
  # WHY: Scaled images without losing quality
  flutter_svg: ^2.0.9
  
  # Screen Util - Responsive design
  # WHY: Make app work on different screen sizes
  flutter_screenutil: ^5.9.0
  
  # ========================================
  # NETWORK
  # ========================================
  # Dio - HTTP Client
  # WHY: Better than http package, supports interceptors, timeouts
  dio: ^5.3.4
  
  # Connectivity - Check internet status
  # WHY: Show offline indicators, handle no internet gracefully
  connectivity_plus: ^5.0.1
  
  # ========================================
  # LOCAL STORAGE
  # ========================================
  # Shared Preferences - Simple key-value storage
  # WHY: Store auth tokens, user preferences, settings
  shared_preferences: ^2.2.2
  
  # Get Storage - Faster alternative to shared preferences
  # WHY: Better performance, supports complex data
  get_storage: ^2.1.1
  
  # ========================================
  # NOTIFICATIONS
  # ========================================
  # Local Notifications - Push notifications
  # WHY: Remind users to log their food
  flutter_local_notifications: ^16.1.0
  
  # ========================================
  # DATE & TIME
  # ========================================
  # Intl - Date formatting and internationalization
  # WHY: Format dates, times, numbers properly
  intl: ^0.18.1
  
  # ========================================
  # IMAGES
  # ========================================
  # Image Picker - Select from gallery or camera
  # WHY: Allow users to add food photos
  image_picker: ^1.0.4
  
  # Cached Network Image - Cache images
  # WHY: Faster image loading, save data usage
  cached_network_image: ^3.3.1
  
  # ========================================
  # UI ENHANCEMENTS
  # ========================================
  # Shimmer - Loading placeholders
  # WHY: Better loading experience
  shimmer: ^3.0.0
  
  # Loading Indicator - Spinners
  # WHY: Show when something is loading
  flutter_spinkit: ^5.2.0
  
  # ========================================
  # SPLASH SCREEN
  # ========================================
  # Native Splash - Native splash screens
  # WHY: Professional splash screen on both platforms
  flutter_native_splash: ^2.3.10
  
  # ========================================
  # OTHER
  # ========================================
  # Package Info - Get app version
  # WHY: Show version in settings
  package_info_plus: ^4.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  
  # Assets
  assets:
    - assets/images/
    - assets/icons/